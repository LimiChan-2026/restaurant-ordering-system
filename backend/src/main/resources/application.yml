server:
  port: 8081

spring:
  config:
    import: optional:classpath:application-local.yml
  application:
    name: restaurant-reservation-system

  # 数据源配置
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/rrs?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    druid:
      # 初始化连接数
      initial-size: 5
      # 最小空闲连接
      min-idle: 5
      # 最大活跃连接
      max-active: 20
      # 获取连接超时时间
      max-wait: 60000
      # 间隔多久进行一次检测，检测需要关闭的空闲连接
      time-between-eviction-runs-millis: 60000
      # 一个连接在池中最小生存的时间
      min-evictable-idle-time-millis: 300000
      # 验证SQL
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false

# MyBatis Plus配置
mybatis-plus:
  configuration:
    # 驼峰命名转换
    map-underscore-to-camel-case: true
    # 日志输出（开发环境开启）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 主键生成策略
      id-type: auto
      # 逻辑删除
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  # Mapper XML文件路径
  mapper-locations: classpath:mapper/**/*.xml

# JWT配置
jwt:
  # 密钥（生产环境请更换为更复杂的密钥）
  secret: ${JWT_SECRET:}
  # Token过期时间（毫秒）- 24小时
  expiration: 86400000
  # Token前缀
  token-prefix: "Bearer "
  # Header名称
  header: Authorization

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080}
  upload:
    base-url: ${UPLOAD_BASE_URL:}

# 日志配置
logging:
  level:
    com.kmbeast: debug
    org.springframework: info
